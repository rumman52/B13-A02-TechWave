<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    </style>
    <title>TechWave</title>
  </head>
  <body>
    <header>
      <div
        class="flex items-center justify-between bg-[#412567] px-4 py-4 min-[992px]:px-[200px] min-[992px]:pt-[30px"
      >
        <h2
          class="text-2xl min-[992px]:text-4xl font-bold leading-none text-white"
        >
          Tech<span
            class="bg-[linear-gradient(90deg,#F8EA4A_0%,#FF2FB2_55%,#7B00FF_100%)] bg-clip-text text-transparent"
            >Wave</span
          >
        </h2>

        <nav
          class="hidden min-[992px]:flex items-center gap-8 text-sm text-white"
        >
          <a href="#" class="hover:text-pink-400">About</a>
          <a href="#" class="hover:text-pink-400">Episodes</a>
          <a href="#" class="hover:text-pink-400">Host</a>
        </nav>

        <button
          class="hover:text-black cursor-pointer hidden min-[992px]:inline-flex h-[44px] w-[135px] items-center justify-center gap-2 rounded-full bg-[linear-gradient(90deg,#F8EA4A_0%,#FF2FB2_55%,#7B00FF_100%)] text-sm font-semibold text-white"
        >
          Subscribe <span>→</span>
        </button>

        <button
          class="hover:text-pink-400 min-[992px]:hidden text-white text-2xl"
        >
          ☰
        </button>
      </div>

      <div
        class="relative w-full min-h-[100svh] bg-no-repeat bg-cover bg-center sm:bg-cover sm:bg-center min-[992px]:bg-cover min-[992px]:bg-center flex flex-col items-center justify-center text-center px-5 py-12"
        style="
          background-image: url(&quot;./assets/hero-bg.png&quot;);
          background-position: center top;
        "
      >
        <div class="relative">
          <img
            src="./assets/hero-circle.png"
            alt="Hero Circle"
            class="w-[130px] sm:w-[190px] md:w-[220px] min-[992px]:w-[270px]"
          />

          <img
            src="./assets/microphone.png"
            alt="Mic Icon"
            class="absolute left-1/2 top-1/2 w-[42px] sm:w-[52px] md:w-[64px] lg:w-[74px] -translate-x-1/2 -translate-y-1/2"
          />

          <span
            class="absolute top-2 right-0 sm:right-1 md:right-2 inline-flex items-center justify-center rounded-full bg-[#24ff84] px-3 py-1 text-[10px] sm:text-xs md:text-sm font-bold text-black shadow-[0_0_20px_rgba(36,255,132,0.45)]"
          >
            NEW
          </span>
        </div>

        <h1
          class="mt-5 text-[34px] sm:text-[42px] min-[992px]:text-5xl font-bold text-white leading-none"
        >
          TechWave
        </h1>

        <p
          class="mt-3 max-w-[320px] sm:max-w-[420px] min-[992px]:max-w-[620px] text-sm sm:text-base min-[992px]:text-lg text-gray-300 leading-relaxed"
        >
          Your daily dose of tech insights, productivity hacks, and personal
          growth
        </p>

        <div
          class="mt-6 flex flex-wrap items-center justify-center gap-3 sm:gap-4"
        >
          <button
            class="hover:text-black cursor-pointer inline-flex h-11 sm:h-12 items-center justify-center gap-2 whitespace-nowrap rounded-full px-4 sm:px-5 min-[992px]:px-6 text-sm sm:text-base font-semibold text-white bg-[linear-gradient(90deg,#F8EA4A_0%,#FF2FB2_55%,#7B00FF_100%)]"
          >
            <img
              src="./assets/spotify.png"
              alt=""
              class="w-4 h-4 sm:w-5 sm:h-5"
            />
            <span>Listen on Spotify</span>
          </button>

          <button
            class="hover:text-black inline-flex cursor-pointer h-11 sm:h-12 items-center justify-center gap-2 whitespace-nowrap rounded-full border border-cyan-400 px-4 sm:px-5 min-[992px]:px-6 text-sm sm:text-base font-semibold text-cyan-300"
          >
            <img
              src="./assets/message.png"
              alt=""
              class="w-4 h-4 sm:w-5 sm:h-5"
            />
            <span>Subscribe</span>
          </button>
        </div>
      </div>
    </header>

    <main></main>

    <footer></footer>
  </body>
</html>
